{% extends "base.html" %}
{% block title %}Create Account – CCS Monitoring{% endblock %}
{% block content %}
<div class="register-main">
  <div style="width:100%;max-width:560px;">
    <a href="{{ url_for('login') }}" class="back-link">← Back to Sign In</a>
    <div class="reg-card">
      <div class="reg-header">
        <h1>Create Your Account</h1>
        <p>Join our monitoring system and start using the platform</p>
      </div>
      <form method="post" action="{{ url_for('register') }}" class="register-form">
        <div class="field-grid">
          <!-- ID Number - Full Width -->
          <div class="field field-full">
            <input 
              type="text" 
              name="id_number" 
              id="id_number" 
              value="{{ data.get('id_number','') }}" 
              placeholder=" " 
              required
            />
            <label for="id_number">ID Number</label>
          </div>

          <!-- First & Last Name -->
          <div class="field">
            <input 
              type="text" 
              name="first_name" 
              id="first_name" 
              value="{{ data.get('first_name','') }}" 
              placeholder=" " 
              required
            />
            <label for="first_name">First Name</label>
          </div>
          <div class="field">
            <input 
              type="text" 
              name="last_name" 
              id="last_name" 
              value="{{ data.get('last_name','') }}" 
              placeholder=" " 
              required
            />
            <label for="last_name">Last Name</label>
          </div>

          <!-- Middle Name - Full Width, Optional -->
          <div class="field field-full">
            <input 
              type="text" 
              name="middle_name" 
              id="middle_name" 
              value="{{ data.get('middle_name','') }}" 
              placeholder=" "
            />
            <label for="middle_name">Middle Name (optional)</label>
          </div>

          <!-- Course & Year Level -->
          <div class="field">
            <div class="select-wrap">
              <select name="course" id="course" required>
                <option value="" disabled {% if not data.get('course') %}selected{% endif %}></option>
                {% for c in courses %}<option value="{{ c }}" {% if data.get('course')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}
              </select>
            </div>
            <label for="course">Course</label>
          </div>
          <div class="field">
            <input 
              type="number" 
              name="course_level" 
              id="course_level" 
              value="{{ data.get('course_level','1') }}" 
              min="1" 
              max="4" 
              placeholder=" "
            />
            <label for="course_level">Year Level</label>
          </div>
          <!-- Email & Address - Full Width -->
          <div class="field field-full">
            <input 
              type="email" 
              name="email" 
              id="email" 
              value="{{ data.get('email','') }}" 
              placeholder=" "
            />
            <label for="email">Email Address</label>
          </div>
          <div class="field field-full">
            <input 
              type="text" 
              name="address" 
              id="address" 
              value="{{ data.get('address','') }}" 
              placeholder=" "
            />
            <label for="address">Address</label>
          </div>
        </div>
        <!-- Password Fields -->
        <div class="field-grid">
          <div class="field field-full" style="position: relative;">
            <input 
              type="password" 
              name="password" 
              id="password" 
              placeholder=" " 
              class="pw-centered" 
              required
            />
            <label for="password">Password</label>
            <button 
              type="button" 
              onclick="togglePw('password', this)" 
              class="show-pw-btn"
              title="Toggle password visibility"
            >Show</button>
          </div>
          <div class="field field-full" style="position: relative;">
            <input 
              type="password" 
              name="repeat_password" 
              id="repeat_password" 
              placeholder=" " 
              class="pw-centered" 
              required
            />
            <label for="repeat_password">Confirm Password</label>
            <button 
              type="button" 
              onclick="togglePw('repeat_password', this)" 
              class="show-pw-btn"
              title="Toggle password visibility"
            >Show</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-register">Create Account</button>
      </form>

      <!-- Footer -->
      <div class="reg-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
      </div>
    </div>
  </div>
</div>

<script>
  // Handle select field styling
  document.querySelectorAll('select').forEach(sel => {
    function check() { 
      sel.closest('.field').classList.toggle('has-value', !!sel.value); 
    }
    sel.addEventListener('change', check); 
    check();
  });

  // Handle input field styling
  document.querySelectorAll('input').forEach(input => {
    function check() {
      input.closest('.field').classList.toggle('has-value', !!input.value);
    }
    input.addEventListener('input', check);
    input.addEventListener('change', check);
  });

  // Toggle password visibility
  function togglePw(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type = 'password';
      btn.textContent = 'Show';
    }
  }
</script>
{% endblock %}
